name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Security problems go to ilikexff@gmail.com, not here.
        See [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to get the same result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash, or `cargo run --locked` from which date.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 26.0
    validations:
      required: true
