[package]
name = "folio"
version = "0.1.0"
edition = "2024"
description = "A small native code reading and editing workspace"
license = "MIT"

[features]
default = ["desktop"]
desktop-tests = ["desktop", "gpui/test-support"]
desktop = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:gpui-component-assets", "dep:image"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
# The official GPUI crates MUST stay on the same commit (see Cargo.lock).
# Build with --locked. Dependency upgrades are a separate, tested change.
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", optional = true, features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c", optional = true, features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-go", "tree-sitter-toml", "tree-sitter-markdown", "tree-sitter-yaml", "tree-sitter-html", "tree-sitter-css"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c", optional = true }

[[bin]]
name = "folio"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
