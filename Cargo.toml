[package]
name = "folio"
version = "0.1.0"
edition = "2024"
description = "A small native code reading and editing workspace"
license = "MIT"

[features]
default = ["desktop"]
desktop-tests = ["desktop", "gpui/test-support"]
# Extra Tree-sitter grammars registered at runtime by src/syntax.rs.
# Kept behind a feature so a library-only build (`cargo test --locked`) does not
# compile them.
syntax = [
    "dep:tree-sitter",
    "dep:tree-sitter-asm",
    "dep:tree-sitter-containerfile",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-elm",
    "dep:tree-sitter-erlang",
    "dep:tree-sitter-fish",
    "dep:tree-sitter-gitcommit",
    "dep:tree-sitter-gleam",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-ini",
    "dep:tree-sitter-less",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-objc",
    "dep:tree-sitter-ocaml",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-r",
    "dep:tree-sitter-regex",
    "dep:tree-sitter-scss",
    "dep:tree-sitter-solidity",
    "dep:tree-sitter-vim",
    "dep:tree-sitter-vue-updated",
    "dep:tree-sitter-xml",
]
# The terminal backend (src/terminal.rs): PTY + VT emulation via
# alacritty_terminal, the same crate Zed embeds. Gated like `syntax` so a
# library-only build (`cargo test --locked`) does not compile it.
terminal = ["dep:alacritty_terminal"]
desktop = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:gpui-component-assets", "dep:image", "syntax", "terminal"]

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
# Extra grammars, registered at runtime in src/syntax.rs (`syntax` feature).
# Each one must speak the `tree-sitter-language` 0.1 ABI of the `tree-sitter`
# 0.26 that gpui-component pins and must export its highlight query; the module
# comment in src/syntax.rs lists the packages rejected by those two checks.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-asm = { version = "0.24", optional = true }
tree-sitter-containerfile = { version = "0.9", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-elm = { version = "5.9", optional = true }
tree-sitter-erlang = { version = "0.20", optional = true }
tree-sitter-fish = { version = "3.6", optional = true }
tree-sitter-gitcommit = { version = "0.5", optional = true }
tree-sitter-gleam = { version = "1", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-ini = { version = "1.4", optional = true }
tree-sitter-less = { version = "1", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-objc = { version = "3", optional = true }
tree-sitter-ocaml = { version = "0.25", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-r = { version = "1.3", optional = true }
tree-sitter-regex = { version = "0.25", optional = true }
tree-sitter-scss = { version = "1", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-vim = { version = "0.4", optional = true }
tree-sitter-vue-updated = { version = "0.1", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }
# Terminal backend (`terminal` feature), driven by src/terminal.rs. The crate
# speaks the VT language and owns the PTY (unix pty / Windows ConPTY); the
# project only draws what its grid holds.
alacritty_terminal = { version = "0.26", optional = true }
# The official GPUI crates MUST stay on the same commit (see Cargo.lock).
# Build with --locked. Dependency upgrades are a separate, tested change.
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", optional = true, features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c", optional = true, features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c", optional = true }

[[bin]]
name = "folio"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Experiment: can a workspace-internal path dependency be redirected?
[patch."https://github.com/longbridge/gpui-component"]
gpui-base = { path = "vendor/gpui-base" }
